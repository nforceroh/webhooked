[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "webhooked"
version = "0.1.0"
description = "Capture and review generic webhook deliveries"
requires-python = ">=3.13"
dependencies = [
    "Django>=6.1,<6.2",
    "gunicorn>=23,<24",
    "whitenoise>=6.9,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-django>=4.11,<5",
    "ruff>=0.14,<0.15",
]
mariadb = [
    "mysqlclient>=2.3,<3",
]

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]
include = ["capture*", "review*", "webhooked*"]

[tool.setuptools.package-data]
review = ["templates/review/*.html", "static/review/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "webhooked.settings"
pythonpath = ["app"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "DJ"]
