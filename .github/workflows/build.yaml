# managed by nforceroh/.github/.github/workflows/image-build.yaml@v1
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    uses: nforceroh/.github/.github/workflows/image-build.yaml@v1
    with:
      dockerfile: docker/Dockerfile
      setup-test-command: pip install -e '.[dev]'
      test-command: python -m pytest && ruff check .
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write